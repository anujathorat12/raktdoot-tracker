<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="topArc"    d="M 14,60 A 46,46 0 1,1 106,60"/>
    <path id="bottomArc" d="M 106,60 A 46,46 0 0,1 14,60"/>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="innerClip">
      <circle cx="60" cy="60" r="37"/>
    </clipPath>
  </defs>

  <!-- Outer dark-red ring -->
  <circle cx="60" cy="60" r="58" fill="#C0202A" filter="url(#shadow)"/>
  <!-- White separator -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Inner white circle base -->
  <circle cx="60" cy="60" r="41" fill="#FFFFFF"/>

  <!-- Curved top text -->
  <text font-size="7" font-weight="900" fill="#FFFFFF" font-family="Arial, sans-serif" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">PATIENT SAFETY &amp; QUALITY OF CARE</textPath>
  </text>

  <!-- Curved bottom text -->
  <text font-size="7.5" font-weight="900" fill="#FFFFFF" font-family="Arial, sans-serif" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">&#9733; ACCREDITED &#9733;</textPath>
  </text>

  <!-- Inner sky-blue background -->
  <circle cx="60" cy="60" r="38" fill="#5DB8E8"/>

  <!-- Bold blue Q ring (thick arc) -->
  <circle cx="60" cy="58" r="24" fill="none" stroke="#1A3A8C" stroke-width="10"/>
  <!-- Q tail bottom-right -->
  <line x1="75" y1="73" x2="84" y2="82" stroke="#1A3A8C" stroke-width="8" stroke-linecap="round"/>

  <!-- Red diagonal sash across centre -->
  <polygon points="32,48 88,48 88,72 32,72" fill="#D92626" transform="rotate(-35,60,60)"/>

  <!-- White outline on sash edges -->
  <line x1="27,45" y1="27,45" x2="93,45" y2="93,45" stroke="none"/>

  <!-- Caduceus (medical staff) simplified at top-centre -->
  <g transform="translate(60,34)">
    <!-- Staff -->
    <line x1="0" y1="-7" x2="0" y2="8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Wings -->
    <path d="M-6,-5 Q-2,-8 0,-6 Q2,-8 6,-5" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Snake curves left -->
    <path d="M-3,-2 Q-5,0 -3,2 Q-5,4 -3,6" stroke="#FFFFFF" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <!-- Snake curves right -->
    <path d="M3,-2 Q5,0 3,2 Q5,4 3,6" stroke="#FFFFFF" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- NABH text -->
  <text x="60" y="77" text-anchor="middle" fill="#1A3A8C" font-family="Arial, sans-serif"
        font-weight="900" font-size="10.5" letter-spacing="1.2">NABH</text>

  <!-- Thin red border on inner circle -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#C0202A" stroke-width="1.2"/>
</svg>
