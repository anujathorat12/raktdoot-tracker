<svg width="96" height="96" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Arc Path -->
    <path id="topArc" d="M 16,60 A 44,44 0 1,1 104,60" />
    <!-- Bottom Arc Path -->
    <path id="bottomArc" d="M 104,60 A 44,44 0 0,1 16,60" />

    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Red Ring -->
  <circle cx="60" cy="60" r="56" fill="#D92626" filter="url(#badgeShadow)"/>
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Curved Top Text: PATIENT SAFETY & QUALITY OF CARE -->
  <text font-size="7.2" font-weight="800" fill="#FFFFFF" letter-spacing="0.4" font-family="system-ui, sans-serif">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      PATIENT SAFETY &amp; QUALITY OF CARE
    </textPath>
  </text>

  <!-- Curved Bottom Text: ★ ACCREDITED ★ -->
  <text font-size="8" font-weight="800" fill="#FFFFFF" letter-spacing="0.8" font-family="system-ui, sans-serif">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ★ ACCREDITED ★
    </textPath>
  </text>

  <!-- Inner White Circle -->
  <circle cx="60" cy="60" r="38" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="37" fill="none" stroke="#D92626" stroke-width="1"/>

  <!-- Inner Blue Ring / Arc -->
  <path d="M 60 26 A 22 22 0 1 0 77.5 73.5" fill="none" stroke="#0B4F9C" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Red Triangle in Center -->
  <polygon points="60,34 43,65 77,65" fill="#D92626"/>

  <!-- Caduceus Medical Staff Icon in center -->
  <path d="M 60,38 L 60,60 M 54,43 C 66,43 66,48 54,53 M 66,43 C 54,43 54,48 66,53 M 55,38 C 60,36 60,36 65,38" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- NABH Text -->
  <text x="60" y="74.5" text-anchor="middle" fill="#0B4F9C" font-family="system-ui, sans-serif" font-weight="900" font-size="9" letter-spacing="0.8">NABH</text>
</svg>
