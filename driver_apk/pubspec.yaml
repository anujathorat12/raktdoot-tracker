name: driver_apk
description: Real-Time Delivery Driver App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.1

  # Camera & Media
  image_picker: ^1.1.2

  # Storage
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
